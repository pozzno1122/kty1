<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABA PayWay KHQR Checkout</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px; background-color: #f7f7f7;">

    <div style="background: white; padding: 30px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; width: 100%;">
        <h2>ទូទាត់ប្រាក់តាម ABA KHQR</h2>
        <p style="color: #666; margin-bottom: 20px;">ចំនួនទឹកប្រាក់: <strong style="color: #008080;">$10.00</strong></p>
        
        <!-- ប៊ូតុងទូទាត់សុទ្ធ គ្មាន Form យោងទៅណាទេ -->
        <button id="pay-btn" style="padding: 12px 24px; background: #008080; color: white; border: none; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%;">
            បង់ប្រាក់ឥឡូវនេះ (KHQR)
        </button>

        <!-- កន្លែងបង្ហាញ QR Code -->
        <div id="qr-container" style="margin-top: 20px; display: none;">
            <p style="font-weight: bold; color: #333; margin-bottom: 10px;">សូមស្កេនដើម្បីទូទាត់៖</p>
            <img id="qr-image" src="" alt="ABA KHQR" style="width: 220px; height: 220px; border: 1px solid #ddd; border-radius: 8px; padding: 5px;"><br><br>
            <a id="deeplink-btn" href="" target="_blank" style="display: none; background: #FF6600; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">បើកក្នុងកម្មវិធី ABA Mobile</a>
        </div>
    </div>

    <script>
        document.getElementById('pay-btn').addEventListener('click', async function () {
            const merchant_id = "ec480530";
            const api_key = "FDCB5F572548AF9C2C08FEE4949D8C5A04842620";
            
            let req_time = Date.now().toString();
            let tran_id = "INV-" + req_time;
            let amount = "10.00";
            let items = btoa(JSON.stringify([{name: "Test Item", quantity: "1", price: "10.00"}]));

            let hash_string = req_time + merchant_id + tran_id + amount + items;
            let hash = CryptoJS.enc.Base64.stringify(CryptoJS.HmacSHA512(hash_string, api_key));

            let formData = new URLSearchParams();
            formData.append('merchant_id', merchant_id);
            formData.append('req_time', req_time);
            formData.append('tran_id', tran_id);
            formData.append('amount', amount);
            formData.append('items', items);
            formData.append('hash', hash);

            try {
                let response = await fetch('https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                let data = await response.json();

                if (data.qrImage) {
                    document.getElementById('qr-image').src = data.qrImage;
                    
                    if (data.abamobilebank) {
                        let deeplinkBtn = document.getElementById('deeplink-btn');
                        deeplinkBtn.href = data.abamobilebank;
                        deeplinkBtn.style.display = 'inline-block';
                    }

                    document.getElementById('qr-container').style.display = 'block';
                    document.getElementById('pay-btn').style.display = 'none';
                } else {
                    alert("កំហុសឆ្គង៖ " + JSON.stringify(data));
                }
            } catch (error) {
                alert("Connection Error: " + error.message);
            }
        });
    </script>
</body>
</html>
